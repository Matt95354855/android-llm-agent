name: Images

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pod-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="sha-${GITHUB_SHA::12}"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phone_emulator-pod:${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/pod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          provenance: false
      - name: Digest publié
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.tag }}" | tee -a "$GITHUB_STEP_SUMMARY"
